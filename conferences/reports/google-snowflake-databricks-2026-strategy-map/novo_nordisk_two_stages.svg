<svg viewBox="0 0 700 374" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Novo Nordisk — one company, two stages</title>
<desc id="d">Side-by-side of how Novo Nordisk presented at each 2026 summit. At Snowflake: flagship Snowflake CoWork, talk "Move Beyond Prototypes to High-Velocity AI Products," sent a VP of AI Foundation, framed as commercial outcomes. At Databricks: flagship Lakebase and Genie, talk on clinical data integration 30x faster plus Genie dashboards, sent platform architects, framed as infrastructure. Same governed-AI-on-pharma reality, opposite framing.</desc>
<text x="350" y="28" text-anchor="middle" font-size="16" font-weight="500" fill="var(--color-text-primary)">Novo Nordisk — one company, two stages</text>
<text x="350" y="48" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">same pharma data org, both summits, same month — different message</text>

<rect x="20" y="64" width="320" height="278" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="1"/>
<rect x="360" y="64" width="320" height="278" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="1"/>

<text x="36" y="92" font-size="14" font-weight="500" fill="#185FA5">SNOWFLAKE</text>
<line x1="36" y1="102" x2="324" y2="102" stroke="#185FA5" stroke-width="1.5"/>
<text x="376" y="92" font-size="14" font-weight="500" fill="#A32D2D">DATABRICKS</text>
<line x1="376" y1="102" x2="664" y2="102" stroke="#A32D2D" stroke-width="1.5"/>

<text x="36" y="126" font-size="10.5" letter-spacing="0.5" fill="var(--color-text-tertiary)">FLAGSHIP IT BROUGHT</text>
<text x="36" y="144" font-size="12.5" fill="var(--color-text-primary)">Snowflake CoWork + Cortex agents</text>
<text x="376" y="126" font-size="10.5" letter-spacing="0.5" fill="var(--color-text-tertiary)">FLAGSHIP IT BROUGHT</text>
<text x="376" y="144" font-size="12.5" fill="var(--color-text-primary)">Lakebase + Genie / Agent Bricks</text>

<text x="36" y="174" font-size="10.5" letter-spacing="0.5" fill="var(--color-text-tertiary)">THE TALK</text>
<text x="36" y="192" font-size="12.5" fill="var(--color-text-primary)">“Move Beyond Prototypes to</text>
<text x="36" y="208" font-size="12.5" fill="var(--color-text-primary)">High-Velocity AI Products”</text>
<text x="376" y="174" font-size="10.5" letter-spacing="0.5" fill="var(--color-text-tertiary)">THE TALK</text>
<text x="376" y="192" font-size="12.5" fill="var(--color-text-primary)">Clinical data integration on Lakebase</text>
<text x="376" y="208" font-size="12.5" fill="var(--color-text-primary)">(30× faster) + Genie dashboards</text>

<text x="36" y="238" font-size="10.5" letter-spacing="0.5" fill="var(--color-text-tertiary)">WHO THEY SENT</text>
<text x="36" y="256" font-size="12.5" font-weight="500" fill="#185FA5">VP – AI Foundation</text>
<text x="376" y="238" font-size="10.5" letter-spacing="0.5" fill="var(--color-text-tertiary)">WHO THEY SENT</text>
<text x="376" y="256" font-size="12.5" font-weight="500" fill="#A32D2D">Platform &amp; solution architects</text>

<text x="36" y="286" font-size="10.5" letter-spacing="0.5" fill="var(--color-text-tertiary)">THE FRAME</text>
<text x="36" y="304" font-size="12.5" fill="var(--color-text-primary)">Commercial AI products. Outcomes.</text>
<text x="376" y="286" font-size="10.5" letter-spacing="0.5" fill="var(--color-text-tertiary)">THE FRAME</text>
<text x="376" y="304" font-size="12.5" fill="var(--color-text-primary)">Infrastructure. Migration. Throughput.</text>

<text x="350" y="362" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Same governed-AI-on-pharma reality — Snowflake sells the outcome, Databricks sells the build.</text>
