<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Who customers send on stage — seniority mix, Databricks vs Snowflake 2026</title>
<desc id="d">Grouped bars showing the share of enterprise customer speakers by seniority tier at each summit. C-suite: Snowflake 20.0%, Databricks 17.8%. VP: Snowflake 13.6%, Databricks 10.9%. Director or Head: Snowflake 28.7%, Databricks 27.8%. Manager: Snowflake 11.0%, Databricks 10.7%. Senior IC: Snowflake 10.5%, Databricks 11.9%. IC or practitioner: Snowflake 11.4%, Databricks 14.3%. Builder-to-buyer ratio: Snowflake 0.65, Databricks 0.91.</desc>
