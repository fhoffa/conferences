<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Who is on stage — partner sessions by segment, Databricks vs Snowflake 2026</title>
<desc id="d">Grouped bars comparing partner speaking sessions at each summit. Third-party BI vendors: Snowflake 16, Databricks 5. Modern data stack ecosystem: Snowflake 23, Databricks 7. AI-app builders: Snowflake 7, Databricks 11.</desc>
<text x="24" y="30" font-size="15" font-weight="500" fill="var(--color-text-primary)">Who each conference puts on stage</text>
<text x="24" y="50" font-size="12" fill="var(--color-text-secondary)">partner speaking sessions, by segment</text>
<rect x="486" y="20" width="11" height="11" rx="2" fill="#185FA5"/>
<text x="502" y="30" font-size="12" fill="#185FA5">Snowflake</text>
<rect x="582" y="20" width="11" height="11" rx="2" fill="#A32D2D"/>
<text x="598" y="30" font-size="12" fill="#A32D2D">Databricks</text>
<line x1="250" y1="72" x2="250" y2="300" stroke="var(--color-border-tertiary)" stroke-width="1"/>

<text x="24" y="90" font-size="13" fill="var(--color-text-primary)">Third-party BI / viz</text>
<text x="24" y="106" font-size="11" fill="var(--color-text-tertiary)">Sigma, Hex, ThoughtSpot, Qlik…</text>
<rect x="250" y="80" width="292" height="20" rx="2" fill="#185FA5"/>
<text x="548" y="95" font-size="12" font-weight="500" fill="#185FA5">16</text>
<rect x="250" y="104" width="91" height="20" rx="2" fill="#A32D2D"/>
<text x="347" y="119" font-size="12" font-weight="500" fill="#A32D2D">5</text>

<text x="24" y="160" font-size="13" fill="var(--color-text-primary)">Modern data stack</text>
<text x="24" y="176" font-size="11" fill="var(--color-text-tertiary)">Fivetran, dbt, Atlan, Monte Carlo…</text>
<rect x="250" y="150" width="420" height="20" rx="2" fill="#185FA5"/>
<text x="676" y="165" font-size="12" font-weight="500" fill="#185FA5" text-anchor="end">23</text>
<rect x="250" y="174" width="128" height="20" rx="2" fill="#A32D2D"/>
<text x="384" y="189" font-size="12" font-weight="500" fill="#A32D2D">7</text>

<text x="24" y="230" font-size="13" fill="var(--color-text-primary)">AI-app builders</text>
<text x="24" y="246" font-size="11" fill="var(--color-text-tertiary)">Replit, LangChain, Lovable…</text>
<rect x="250" y="220" width="128" height="20" rx="2" fill="#185FA5"/>
<text x="384" y="235" font-size="12" font-weight="500" fill="#185FA5">7</text>
<rect x="250" y="244" width="201" height="20" rx="2" fill="#A32D2D"/>
<text x="457" y="259" font-size="12" font-weight="500" fill="#A32D2D">11</text>

<line x1="24" y1="292" x2="676" y2="292" stroke="var(--color-border-tertiary)" stroke-width="1"/>
<text x="24" y="316" font-size="12.5" fill="var(--color-text-secondary)">Of ~848 companies that spoke, only <tspan font-weight="500" fill="var(--color-text-primary)">83 (under 10%)</tspan> appeared at both summits.</text>
</svg>